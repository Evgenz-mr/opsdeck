approvals:
  enabled: false

environments:
  dev:
    description: Development Kubernetes environment
    kubernetes:
      mode: kubeconfig
      context: opsdeck
      namespaces: [devops-costcalc]
  stable:
    description: Stable integration environment
    kubernetes:
      mode: kubeconfig
      context: opsdeck
      namespaces: [stable]
  sandbox:
    description: Sandbox environment
    kubernetes:
      mode: kubeconfig
      context: opsdeck
      namespaces: [sandbox]
  ift:
    description: IFT environment
    kubernetes:
      mode: kubeconfig
      context: opsdeck
      namespaces: [ift]

services:
  victoriametrics:
    display_name: VictoriaMetrics Cluster
    type: cluster
    description: vmselect, vminsert and vmstorage health and certificate operations
    targets:
      ift:
        vminsert-193:
          display_name: vminsert-193
          role: vminsert
          host: vm-szux-pc-vic-193.vdc03.pc.dev.sbt
          user: opsdeck
          actions:
            - renew-victoriametrics-certificate
        vmselect-194:
          display_name: vmselect-194
          role: vmselect
          host: vm-szux-pc-vic-194.vdc03.pc.dev.sbt
          user: opsdeck
          actions:
            - renew-victoriametrics-certificate
        vmstorage-195:
          display_name: vmstorage-195
          role: vmstorage
          host: vm-szux-pc-vic-195.vdc03.pc.dev.sbt
          user: opsdeck
          actions:
            - renew-victoriametrics-certificate
  kafka:
    display_name: Kafka
    description: Broker and consumer health
  postgres:
    display_name: PostgreSQL
    description: Primary/replica and connection health
  s3:
    display_name: S3
    description: Object storage health and synthetic checks
