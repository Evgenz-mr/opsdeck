services:
  opsdeck:
    build: .
    container_name: opsdeck
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OPSDECK_CONFIG: /app/config/opsdeck.yaml
      OPSDECK_DB_URL: sqlite+aiosqlite:////data/opsdeck.db
      OPSDECK_APPROVALS_ENABLED: "false"
      OPSDECK_KUBECONFIG: /home/opsdeck/.kube/config
      OPSDECK_ACTION_TOKEN_FILE: /run/secrets/action-token
      OPSDECK_SSH_KNOWN_HOSTS: /home/opsdeck/.ssh/known_hosts
      OPSDECK_SSH_PRIVATE_KEY: /home/opsdeck/.ssh/id_ed25519
    volumes:
      - opsdeck-data:/data
      - ./config/opsdeck.yaml:/app/config/opsdeck.yaml:ro
      - ${OPSDECK_KUBECONFIG_HOST:-./secrets/kubeconfig}:/home/opsdeck/.kube/config:ro
      - ${OPSDECK_ACTION_TOKEN_FILE_HOST:-./secrets/action-token}:/run/secrets/action-token:ro
      - ${OPSDECK_SSH_DIR_HOST:-./secrets/ssh}:/home/opsdeck/.ssh:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  opsdeck-data:
