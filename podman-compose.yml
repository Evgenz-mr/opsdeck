version: "3.8"

services:
  opsdeck:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/opsdeck:1.0.0
    container_name: opsdeck
    restart: unless-stopped
    network_mode: host
    environment:
      OPSDECK_CONFIG: /app/config/opsdeck.yaml
      OPSDECK_DB_URL: sqlite+aiosqlite:////data/opsdeck.db
      OPSDECK_APPROVALS_ENABLED: "false"
      OPSDECK_KUBECONFIG: /home/opsdeck/.kube/config
      OPSDECK_ACTION_TOKEN_FILE: /run/secrets/action-token
      OPSDECK_SSH_KNOWN_HOSTS: /home/opsdeck/.ssh/known_hosts
      OPSDECK_SSH_PRIVATE_KEY: /home/opsdeck/.ssh/id_ed25519
    volumes:
      - ${OPSDECK_DATA_DIR}:/data:Z
      - ./config/opsdeck.yaml:/app/config/opsdeck.yaml:ro,Z
      - ${OPSDECK_KUBECONFIG_HOST}:/home/opsdeck/.kube/config:ro,Z
      - ${OPSDECK_ACTION_TOKEN_FILE_HOST}:/run/secrets/action-token:ro,Z
      - ${OPSDECK_SSH_DIR_HOST}:/home/opsdeck/.ssh:ro,Z
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
