apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsdeck-diagnostics
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsdeck-diagnostics
subjects:
  - kind: ServiceAccount
    name: opsdeck
    namespace: opsdeck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opsdeck-diagnostics
